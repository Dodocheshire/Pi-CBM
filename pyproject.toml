[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-cbm"
version = "0.1.0"
description = "Configurable positive-incentive noise experiments for concept bottleneck models"
requires-python = ">=3.11"
# openai-clip 1.0.1 imports pkg_resources, removed in setuptools 81.
dependencies = ["torch>=2.2", "torchvision>=0.17", "openai-clip==1.0.1", "pytorchcv==0.0.74", "setuptools<81", "PyYAML>=6", "numpy>=1.24", "tqdm>=4.64"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["pi_cbm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["pi_cbm/vendor", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
pi_cbm = ["vendor/lfcbm/provenance.json"]
